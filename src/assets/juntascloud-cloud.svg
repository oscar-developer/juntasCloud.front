<svg xmlns="http://www.w3.org/2000/svg" width="96" height="72" viewBox="0 0 96 72" fill="none">
  <!-- Recorte para que abajo quede plano -->
  <defs>
    <!-- La parte visible llega hasta y=58 (base plana) -->
    <clipPath id="clip-flat-bottom">
      <rect x="0" y="0" width="96" height="58" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip-flat-bottom)">
    <!-- NUBE ROJA (atrás) -->
    <!-- 3 círculos para la forma "inflada" -->
    <circle cx="30" cy="32" r="18" fill="#E87457"/>
    <circle cx="42" cy="22" r="18" fill="#E87457"/>
    <circle cx="50" cy="36" r="16" fill="#E87457"/>

    <!-- NUBE NARANJA (adelante) -->
    <!-- 3 círculos para el volumen frontal -->
    <circle cx="58" cy="42" r="20" fill="#F2B15A"/>
    <circle cx="72" cy="40" r="18" fill="#F2B15A"/>
    <circle cx="50" cy="46" r="16" fill="#F2B15A"/>
  </g>

  <!-- (Opcional) línea invisible para mantener espacio -->
  <rect x="0" y="0" width="96" height="72" fill="transparent"/>
</svg>